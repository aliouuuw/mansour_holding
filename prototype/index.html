<title>Mansour Motors — Le Carnet de Route</title>

<!--
  DIRECTION CONTRACT

  THESIS: The stock is a navigator's road-book, read waypoint by waypoint under its
  lamp. It refuses the dark-cinematic dealer page: no video hero, no stat strip, no
  card rail.
  OWN-WORLD: Bitumen ground, manila paper panels, black keyline ink, laterite hazard
  mark, and gold demoted from sprayed accent to the holder's raking lamp. Bespoke
  Stencil letters the waypoints; Tabular sets every figure.
  STORY: A finite route of eight machines, each with real distance, real chassis
  number, real price, ending at a call to the showroom.
  FIRST VIEWPORT: Holder bezel top and bottom. Waypoint 01 in register: photograph
  filling the lit window right, paper panel left carrying the tulip, the distance
  column and the price. The action sits under the column.
  FORM: Le Carnet de Route, candidate 3 of the grounded list, staged as one
  continuous space (staging 1). Seed key 332e28f3.
-->
