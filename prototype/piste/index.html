<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mansour Motors — La Piste</title>

<!--
  DIRECTION CONTRACT — La Piste

  THESIS: Dakar at two in the afternoon. The parc is not a page, it is a piste, and the
  machines live inside the heat rising off the tar. Speed makes heat, stillness makes
  clarity. It refuses the scrolling landing page and the dashboard alike.
  OWN-WORLD: Warm tar black, bleached sky, brand gold as the only light. A WebGL heat
  shader with a true inverted mirage on the ground. Type is instrument-minimal: small,
  letterspaced, tabular, placed on a strict grid so the machine and the haze own the frame.
  STORY: You drive the piste, pass the machines, brake into one, and it resolves out of
  the shimmer. Then you call the showroom.
  FIRST VIEWPORT: One machine held in the haze, the piste ticks along the bottom, the
  readout at the foot, the heat gauge at the right. The drag hint is the only instruction.
  DELIGHT THESIS: holding still is rewarded — the desert gives the machine up only to
  someone who stops.
  FALLBACK: without WebGL, or under reduced motion, the same machine renders sharp as
  a plain photograph with every readout and control unchanged. Nothing here depends on
  the shader existing.
-->

<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=technor@400,500,600,700&f[]=switzer@400,500&display=swap">
<link rel="stylesheet" href="piste.css">
</head>
<body>

<a class="skip" href="#readout">Aller a la fiche</a>

<!-- the piste itself -->
<div class="stage" id="stage">
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <span class="grain" aria-hidden="true"></span>
</div>

<header class="top">
  <p class="mark">Mansour <span>Motors</span></p>
  <p class="place">Dakar <i aria-hidden="true"></i> la piste</p>
</header>

<!-- the heat gauge: the shader's own uniform, shown honestly -->
<div class="heat" aria-hidden="true">
  <p class="heat__k">Chaleur</p>
  <span class="heat__track"><span class="heat__fill" id="heat-fill"></span></span>
</div>

<!-- the readout -->
<section class="readout" id="readout" aria-live="polite">
  <p class="readout__idx"><span id="r-i">01</span><i>/08</i></p>

  <div class="readout__id">
    <p class="readout__make" id="r-make">Toyota</p>
    <h1 class="readout__model" id="r-model">Land Cruiser 300 GR Sport</h1>
    <span class="readout__rule" id="r-rule" aria-hidden="true"></span>
  </div>

  <dl class="readout__figs">
    <div><dt>Compteur</dt><dd><span id="r-km">1 200</span><i>km</i></dd></div>
    <div><dt>Annee</dt><dd id="r-year">2024</dd></div>
    <div><dt>Boite</dt><dd id="r-box">Automatique</dd></div>
    <div><dt>Etat</dt><dd id="r-state">Disponible</dd></div>
  </dl>

  <div class="readout__end">
    <p class="price"><span id="r-price">52 000 000</span><i>FCFA</i></p>
    <a class="key" id="r-call" href="tel:+221331234567"><span class="key__face">Appeler</span></a>
  </div>
</section>

<!-- the piste ticks: eight machines along the road -->
<nav class="ticks" id="ticks" aria-label="Machines sur la piste"></nav>

<p class="hint" id="hint">Glissez, ou <kbd>&larr;</kbd><kbd>&rarr;</kbd></p>

<noscript>
  <p class="hint">Cette piste a besoin de JavaScript. Le parc reste joignable au +221 33 123 45 67.</p>
</noscript>

<script type="module" src="piste.js"></script>
</body>
</html>
